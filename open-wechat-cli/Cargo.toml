[package]
name = "owc"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "owc"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4.3"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
pbkdf2 = "0.12"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"

[dev-dependencies]
tempfile = "3"
